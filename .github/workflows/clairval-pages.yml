name: Publier Clairval
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clairval-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Vérifier Auth et campagnes
        working-directory: EXEMPLES/CLAIRVAL
        run: |
          node check-autosave.mjs
          node check-cloud.mjs
          node check-auth.mjs
          node check-campaign.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: EXEMPLES/CLAIRVAL/dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
